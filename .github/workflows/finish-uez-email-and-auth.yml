name: Finish UEZ email and auth
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-uez-email-and-auth.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/finish_uez_email_and_auth.py
      - name: Verify
        run: |
          node --check backend/routes/uez.js
          node --check backend/routes/uezEmail.js
          node --check backend/services/uezEmail.js
          npm install --ignore-scripts
          npm run build
      - name: Commit
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add backend/routes/uez.js src/App.jsx src/AdminPage.jsx
          git commit -m "Finish UEZ email and auth workflow" || exit 0
          git push
