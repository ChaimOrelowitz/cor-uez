name: Wire Lakewood grant workflow

on:
  push:
    paths:
      - '.github/workflows/wire-lakewood-grant.yml'
      - '.github/scripts/wire_lakewood_grant.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/wire_lakewood_grant.py
      - name: Verify
        run: |
          node --check brc-helper-extension/background.js
          node --check brc-helper-extension/content.js
          node --check brc-helper-extension/jotform.js
          node --check brc-helper-extension/grant-jotform.js
          python -m json.tool brc-helper-extension/manifest.json >/dev/null
          npm install --ignore-scripts
          npm run build
      - name: Commit
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add brc-helper-extension/background.js brc-helper-extension/content.js brc-helper-extension/jotform.js brc-helper-extension/grant-jotform.js brc-helper-extension/manifest.json src/AdminPage.jsx
          git commit -m "Automate Lakewood grant submission packet"
          git push
