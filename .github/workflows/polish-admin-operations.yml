name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply live refresh and login patch
        run: python .github/scripts/fix_live_refresh_and_login.py
      - name: Verify frontend
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Commit changes
        run: |
          git config user.name "Chaim Orelowitz"
          git config user.email "chaim@corsolutions.io"
          git add src/App.jsx src/AdminPage.jsx src/intakePolish.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix live refresh and login UX"
            git push
          fi
