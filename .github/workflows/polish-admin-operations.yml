name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make extension workflows clean incognito sessions
        run: python .github/scripts/make_extension_incognito_clean.py
      - name: Verify extension
        run: |
          node --check brc-helper-extension/background.js
          node -e "JSON.parse(require('fs').readFileSync('brc-helper-extension/manifest.json','utf8')); console.log('manifest ok')"
      - name: Commit changes
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add brc-helper-extension/background.js brc-helper-extension/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Run extension workflows in clean incognito sessions"
            git push
          fi
