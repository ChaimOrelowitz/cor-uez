name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalize geocoder address and document colors
        run: python .github/scripts/normalize_geocoder_address_and_doc_colors.py
      - name: Verify frontend
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Commit changes
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add src/eligibility.js src/App.jsx src/AdminPage.jsx src/styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Normalize UEZ street addresses and document states"
            git push
          fi
