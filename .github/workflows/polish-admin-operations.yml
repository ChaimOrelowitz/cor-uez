name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply launch safety sole-prop and demo flow
        run: python .github/scripts/run_launch_safety_v2.py
      - name: Verify frontend
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Commit changes
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add src/App.jsx src/AdminPage.jsx src/main.jsx src/intakePolish.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Harden sole prop flow and add admin demo client"
            git push
          fi
