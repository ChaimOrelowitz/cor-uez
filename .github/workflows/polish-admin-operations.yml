name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build admin mobile layer
        run: python .github/scripts/build_admin_mobile_layer.py
      - name: Verify frontend
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Commit changes
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add src/AdminPage.jsx src/workflow.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build functional admin mobile layer"
            git push
          fi
