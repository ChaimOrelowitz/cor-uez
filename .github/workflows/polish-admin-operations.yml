name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add PBS account question and cancel closed workflows
        run: python .github/scripts/tighten_pbs_question_and_cancel.py
      - name: Verify frontend backend and extension
        run: |
          npm install --ignore-scripts
          npm run build
          node --check backend/routes/uez.js
          node --check brc-helper-extension/background.js
          node -e "JSON.parse(require('fs').readFileSync('brc-helper-extension/manifest.json','utf8')); console.log('manifest ok')"
      - name: Commit changes
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add src/App.jsx src/AdminPage.jsx src/SignupLayoutPage.jsx src/api.js src/workflow.css backend/routes/uez.js brc-helper-extension/background.js brc-helper-extension/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add PBS account intake and cancel closed workflows"
            git push
          fi
