name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix tax capture, retry, and manual attachment
        run: python .github/scripts/fix_tax_capture_manual_attachment_and_retry.py
      - name: Verify frontend, backend, and extension
        run: |
          node --check backend/routes/uezEmail.js
          node --check brc-helper-extension/content.js
          node --check brc-helper-extension/background.js
          npm install --ignore-scripts
          npm run build
      - name: Commit changes
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add backend/routes/uezEmail.js brc-helper-extension/content.js brc-helper-extension/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix tax clearance capture and email attachment"
            git push
          fi
