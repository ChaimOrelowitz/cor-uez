name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Simplify client tasks and enable replacement uploads
        run: python .github/scripts/simplify_client_tasks.py
      - name: Verify backend and frontend
        run: |
          node --check backend/routes/uez.js
          npm install --ignore-scripts
          npm run build
      - name: Commit changes
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add src/App.jsx backend/routes/uez.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Simplify client tasks and replacement uploads"
            git push
          fi
