name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply BRC client follow-up patch
        run: python .github/scripts/add_brc_client_flow.py
      - name: Verify backend and frontend
        run: |
          node --check backend/routes/uez.js
          node --check backend/routes/uezBrc.js
          node --check backend/services/uezEmail.js
          npm install --ignore-scripts
          npm run build
      - name: Commit changes
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add backend/routes/uez.js backend/routes/uezBrc.js src/api.js src/App.jsx src/AdminPage.jsx src/intakePolish.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add BRC client follow-up workflow"
            git push
          fi
