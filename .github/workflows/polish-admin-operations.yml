name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add signup layout editor and sole-prop undo
        run: python .github/scripts/add_signup_layout_editor.py
      - name: Verify frontend and backend syntax
        run: |
          node --check backend/routes/uez.js
          npm install --ignore-scripts
          npm run build
      - name: Commit changes
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add backend/routes/uez.js src/api.js src/SignupLayoutPage.jsx src/main.jsx src/AdminPage.jsx src/App.jsx src/styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add signup layout editor and sole prop undo"
            git push
          fi
