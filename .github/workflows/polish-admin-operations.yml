name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Right-align Address Continue action
        run: python .github/scripts/right_align_address_continue.py
      - name: Verify frontend
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Commit changes
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add src/App.jsx src/styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Right-align address Continue action"
            git push
          fi
