name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Separate submitted applications from waiting
        run: python .github/scripts/separate_submitted_queue.py
      - name: Verify frontend
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Commit changes
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add src/AdminPage.jsx src/workflow.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Separate submitted applications from waiting"
            git push
          fi
