name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add PBS login-only action and clean Address back button
        run: python .github/scripts/add_pbs_login_action_and_cleanup.py
      - name: Verify extension and frontend
        run: |
          node --check brc-helper-extension/background.js
          node --check brc-helper-extension/content.js
          npm install --ignore-scripts
          npm run build
      - name: Commit changes
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add src/App.jsx src/AdminPage.jsx brc-helper-extension/background.js brc-helper-extension/content.js brc-helper-extension/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add PBS login-only action"
            git push
          fi
