name: Polish UEZ admin operations
on:
  push:
    paths:
      - '.github/workflows/polish-admin-operations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build visual signup grid and visible visit counter
        run: python .github/scripts/visual_signup_grid_and_visit_counter.py
      - name: Verify frontend and backend
        run: |
          node --check backend/routes/uez.js
          npm install --ignore-scripts
          npm run build
      - name: Commit changes
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add backend/routes/uez.js src/App.jsx src/SignupLayoutPage.jsx src/AdminVisitCounter.jsx src/analytics.css src/styles.css src/workflow.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make signup layout visual and surface visit counter"
            git push
          fi
