name: Redesign UEZ admin cockpit
on:
  push:
    paths:
      - '.github/scripts/redesign_admin_cockpit.py'
      - '.github/workflows/redesign-admin-cockpit.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply cockpit patch
        run: python .github/scripts/redesign_admin_cockpit.py
      - name: Verify backend and frontend
        run: |
          node --check backend/routes/uez.js
          npm ci
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/uez.js src/AdminPage.jsx src/styles.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Redesign UEZ admin as operations cockpit"
            git push
          fi