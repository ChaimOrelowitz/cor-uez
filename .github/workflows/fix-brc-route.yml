name: Fix BRC capture route

on:
  push:
    paths:
      - '.github/workflows/fix-brc-route.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply BRC route fix
        run: python .github/scripts/fix_brc_capture_route.py
      - name: Verify backend syntax
        run: node --check backend/routes/uezBrc.js
      - name: Commit fix
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          rm .github/workflows/fix-brc-route.yml .github/scripts/fix_brc_capture_route.py
          git add backend/routes/uezBrc.js .github/workflows/fix-brc-route.yml .github/scripts/fix_brc_capture_route.py
          git commit -m "Fix BRC certificate PDF upload route"
          git push
