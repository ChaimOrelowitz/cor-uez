name: Apply client dashboard and extension permission fix

on:
  push:
    paths:
      - '.github/workflows/fix-jotform-dob.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final fix
        run: |
          python .github/scripts/fix_extension_permission_and_client_dashboard.py
          rm .github/workflows/fix-jotform-dob.yml
      - name: Verify
        run: |
          node --check brc-helper-extension/background.js
          node --check brc-helper-extension/content.js
          python -m json.tool brc-helper-extension/manifest.json >/dev/null
          npm install --ignore-scripts
          npm run build
      - name: Commit
        run: |
          git config user.name "COR UEZ Bot"
          git config user.email "chaim@corsolutions.io"
          git add src/App.jsx src/styles.css brc-helper-extension/manifest.json .github/workflows/fix-jotform-dob.yml
          git commit -m "Fix BRC capture permission and simplify client dashboard"
          git push
